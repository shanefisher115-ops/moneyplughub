<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PrimordiaOS — The Complete 20-Realm Wealth OS</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #02040a;
      --panel-bg: rgba(10, 14, 28, 0.92);
      --panel-border: rgba(6, 182, 212, 0.28);
      --neon-cyan: #06b6d4;
      --neon-blue: #38bdf8;
      --neon-purple: #a855f7;
      --neon-yellow: #facc15;
      --neon-green: #10b981;
      --neon-red: #f43f5e;
      --neon-gold: #fbbf24;
      --font-mono: 'Fira Code', Consolas, monospace;
      --font-display: 'Orbitron', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      background: var(--bg-deep); color: #e2e8f0; font-family: var(--font-mono);
      min-height: 100vh; overflow-x: hidden;
    }
    #bg-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }
    .os-container { position: relative; z-index: 10; display: flex; flex-direction: column; min-height: 100vh; }

    /* Sticky Top Dock */
    .os-dock {
      display: flex; justify-content: space-between; align-items: center; padding: 10px 24px;
      background: rgba(4, 7, 18, 0.96); border-bottom: 1px solid var(--panel-border);
      backdrop-filter: blur(24px); position: sticky; top: 0; z-index: 1000;
    }
    .os-brand { font-family: var(--font-display); font-weight: 900; font-size: 15px; letter-spacing: 2px; color: #fff; }
    .os-brand span { color: var(--neon-cyan); }

    .player-hud {
      display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.1); padding: 4px 12px; border-radius: 20px;
    }
    .level-badge {
      background: linear-gradient(135deg, var(--neon-purple), var(--neon-cyan));
      color: #000; font-weight: 900; font-family: var(--font-display); font-size: 10px;
      padding: 2px 7px; border-radius: 10px;
    }
    .xp-bar-container { width: 90px; height: 6px; background: #010308; border-radius: 3px; overflow: hidden; }
    .xp-bar-fill { height: 100%; background: linear-gradient(90deg, var(--neon-cyan), var(--neon-green)); width: 74%; }

    /* Realm Categorized Navigation Bar */
    .realm-nav-bar {
      display: flex; gap: 6px; padding: 8px 24px; background: #060913; border-bottom: 1px solid rgba(255,255,255,0.06);
      overflow-x: auto; white-space: nowrap; scrollbar-width: none;
    }
    .realm-tab {
      background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.08);
      color: #94a3b8; padding: 6px 12px; border-radius: 6px; cursor: pointer;
      font-family: inherit; font-size: 10px; font-weight: 700; transition: all 0.2s;
    }
    .realm-tab:hover { color: #fff; border-color: var(--neon-cyan); }
    .realm-tab.active {
      background: rgba(6, 182, 212, 0.18); border-color: var(--neon-cyan);
      color: var(--neon-cyan); box-shadow: 0 0 14px rgba(6, 182, 212, 0.35);
    }

    .btn-cyber {
      background: rgba(6, 182, 212, 0.15); border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan); padding: 5px 12px; border-radius: 20px; font-size: 10px;
      font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; font-family: inherit;
    }

    .hud-viewport { padding: 24px; max-width: 1440px; margin: 0 auto; width: 100%; }
    .realm-header-title {
      font-family: var(--font-display); font-size: 18px; letter-spacing: 2px; color: #fff;
      margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between;
    }

    .grid-2 { display: grid; grid-template-columns: 1.25fr 1fr; gap: 20px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 22px; }

    .hud-card {
      background: var(--panel-bg); border: 1px solid var(--panel-border);
      border-radius: 12px; padding: 20px; box-shadow: 0 12px 40px rgba(0,0,0,0.6);
      backdrop-filter: blur(20px); position: relative;
    }
    .card-label { font-size: 11px; letter-spacing: 1.5px; color: #94a3b8; text-transform: uppercase; margin-bottom: 12px; font-weight: 700; }

    canvas.realm-canvas {
      width: 100%; height: 320px; background: #010308; border-radius: 8px;
      border: 1px solid rgba(6,182,212,0.3); display: block;
    }

    .input-row { display: flex; gap: 10px; margin-bottom: 12px; }
    .tx-input {
      flex: 1; background: #010308; border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px; padding: 10px 14px; color: #fff; font-family: inherit; font-size: 12px;
    }
    .btn-action {
      background: rgba(6, 182, 212, 0.18); border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan); padding: 10px 16px; border-radius: 6px; font-weight: 700;
      font-family: inherit; font-size: 11px; cursor: pointer; transition: all 0.2s;
    }
    .btn-action:hover { background: var(--neon-cyan); color: #000; box-shadow: 0 0 14px var(--neon-cyan); }
    .btn-gold { background: rgba(251,191,36,0.2); border-color: var(--neon-gold); color: var(--neon-gold); }
    .btn-gold:hover { background: var(--neon-gold); color: #000; }
    .btn-green { background: rgba(16,185,129,0.18); border-color: var(--neon-green); color: var(--neon-green); }
    .btn-green:hover { background: var(--neon-green); color: #000; }
    .btn-danger { background: rgba(244,63,94,0.18); border-color: var(--neon-red); color: var(--neon-red); }
    .btn-danger:hover { background: var(--neon-red); color: #fff; }

    .slider-row { margin-bottom: 12px; }
    .slider-header { display: flex; justify-content: space-between; font-size: 11px; color: #cbd5e1; margin-bottom: 4px; }
    .slider-input { width: 100%; -webkit-appearance: none; height: 6px; background: #090d16; border-radius: 3px; outline: none; }
    .slider-input::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--neon-cyan); cursor: pointer; }

    .narrator-toast {
      position: fixed; bottom: 20px; right: 20px; background: rgba(10, 15, 30, 0.96);
      border: 1px solid var(--neon-cyan); box-shadow: 0 0 26px rgba(6, 182, 212, 0.45);
      border-radius: 8px; padding: 12px 18px; font-size: 12px; color: #fff;
      display: flex; align-items: center; gap: 10px; z-index: 2000; max-width: 480px;
    }
  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <div class="os-container">
    <!-- Master Top Dock -->
    <nav class="os-dock">
      <div class="os-brand">🌌 PRIMORDIA<span>OS</span> // MONEYPLUGHUB</div>

      <div style="display: flex; gap: 10px; align-items: center;">
        <button id="audio-btn" class="btn-cyber" style="border-color:var(--neon-purple); color:var(--neon-purple);" onclick="toggleAudio()">🔊 SOUND: OFF</button>

    </nav>

    <!-- 20-Realm Categorized Navigation Bar -->
    <div class="realm-nav-bar">
      <button class="realm-tab active" onclick="switchRealm('sigilforge')">🌌 3D SIGIL FORGE</button>
      <button class="realm-tab" onclick="switchRealm('gamified')">🏆 TROPHIES & QUESTS</button>

      <button class="realm-tab" onclick="switchRealm('chronos')">⏳ CHRONOS TIME</button>

  </div>

  <div id="toast" class="narrator-toast"><span>🗣️</span><span id="toast-msg">PrimordiaOS Master Matrix Online.</span></div>

  <script>
    let currentRealm = 'sigilforge';
    let audioEnabled = false;
    let audioCtx = null;

    // Master Financial State
    let netWorth = 94200.00;
    let vaultLiquidity = 42850.00;
    let currentXP = 3450, playerLevel = 14, maxXP = 4000;
    let lootCrates = 2;

    // Sigil 3D State
    let rotX = 0.3, rotY = 0.4, isDragging = false, lastX = 0, lastY = 0;
    let sigilShape = 'tesseract', sigilColor = '#06b6d4', harmonicFreq = 528;

    function playTone(freq = 528) {
      if (!audioEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.9);
      } catch(e) {}
    }

    function speak(text) {
      const msg = document.getElementById('toast-msg');
      if (msg) msg.innerText = text;
      if (!audioEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.pitch = 0.85; u.rate = 0.9;
      window.speechSynthesis.speak(u);
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      const btn = document.getElementById('audio-btn');
      if (btn) {
        btn.innerText = audioEnabled ? "🔊 SOUND: ACTIVE" : "🔇 SOUND: OFF";
        btn.style.color = audioEnabled ? "var(--neon-green)" : "var(--neon-purple)";
        btn.style.borderColor = audioEnabled ? "var(--neon-green)" : "var(--neon-purple)";
      }
      if (audioEnabled) {
        playTone(harmonicFreq);
        speak("Cybernetic acoustic audio matrix online.");
      }
    }

    function switchRealm(target) {
      currentRealm = target;
      document.querySelectorAll('.realm-tab').forEach(b => {
        b.classList.toggle('active', b.getAttribute('onclick').includes(target));
      });
      playTone(600);
      speak(`Entering ${target.toUpperCase()} Realm.`);
      render();
    }

    function addXP(amount) {
      currentXP += amount;
      speak(`+${amount} XP earned!`);
      if (currentXP >= maxXP) {
        playerLevel++;
        currentXP -= maxXP;
        maxXP = Math.round(maxXP * 1.25);
        lootCrates++;
        speak(`Level Up! You are now Level ${playerLevel}!`);
      }
      updateHUD();
      render();
    }

    function updateHUD() {
      const lvl = document.getElementById('hud-lvl');
      const fill = document.getElementById('hud-xp-fill');
      const txt = document.getElementById('hud-xp-text');
      if (lvl) lvl.innerText = `LVL ${playerLevel}`;
      if (fill) fill.style.width = `${Math.min(100, (currentXP/maxXP)*100)}%`;
      if (txt) txt.innerText = `${currentXP.toLocaleString()} / ${maxXP.toLocaleString()} XP`;
    }

    // 3D Wireframe Canvas Loop
    function init3DForge() {
      const canvas = document.getElementById('sigil-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      canvas.width = canvas.parentElement ? (canvas.parentElement.clientWidth - 40) : 550;
      canvas.height = 320;

      canvas.onmousedown = (e) => { isDragging = true; lastX = e.clientX; lastY = e.clientY; };
      window.onmouseup = () => { isDragging = false; };
      window.onmousemove = (e) => {
        if (!isDragging) return;
        rotY += (e.clientX - lastX) * 0.01;
        rotX += (e.clientY - lastY) * 0.01;
        lastX = e.clientX; lastY = e.clientY;
      };

      let angle = 0;
      function loop3D() {
        if (!document.getElementById('sigil-canvas') || currentRealm !== 'sigilforge') return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        angle += 0.015;

        const cx = canvas.width / 2, cy = canvas.height / 2;

        function project(x, y, z) {
          const cosY = Math.cos(rotY + angle), sinY = Math.sin(rotY + angle);
          let x1 = x * cosY - z * sinY, z1 = z * cosY + x * sinY;
          const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
          let y1 = y * cosX - z1 * sinX, z2 = z1 * cosX + y * sinX;
          const scale = 300 / (300 + z2 + 200);
          return { px: cx + x1 * scale, py: cy + y1 * scale };
        }

        ctx.strokeStyle = sigilColor;
        ctx.lineWidth = 2;
        ctx.shadowBlur = 14;
        ctx.shadowColor = sigilColor;

        // Rings
        [75, 115].forEach((rad, i) => {
          ctx.beginPath();
          for (let a = 0; a <= Math.PI * 2; a += 0.25) {
            const p = project(Math.cos(a) * rad, Math.sin(a * 2 + angle * (i+1)) * 14, Math.sin(a) * rad);
            if (a === 0) ctx.moveTo(p.px, p.py); else ctx.lineTo(p.px, p.py);
          }
          ctx.closePath();
          ctx.stroke();
        });

        // 3D Cube Nodes
        const s = 50;
        const verts = [[-s,-s,-s],[s,-s,-s],[s,s,-s],[-s,s,-s],[-s,-s,s],[s,-s,s],[s,s,s],[-s,s,s]];
        const proj = verts.map(v => project(v[0], v[1], v[2]));
        const edges = [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];

        edges.forEach(e => {
          ctx.beginPath();
          ctx.moveTo(proj[e[0]].px, proj[e[0]].py);
          ctx.lineTo(proj[e[1]].px, proj[e[1]].py);
          ctx.stroke();
        });

        // Center Pulsing Core
        ctx.fillStyle = sigilColor;
        ctx.beginPath();
        const core = project(0,0,0);
        ctx.arc(core.px, core.py, 6 + Math.sin(angle*4)*3, 0, Math.PI*2);
        ctx.fill();

        requestAnimationFrame(loop3D);
      }
      loop3D();
    }

    function render() {
      const vp = document.getElementById('viewport');
      if (!vp) return;
      let html = '';

      // Universal Top Metric Cards
      const topCards = `
        <div class="grid-4">
          <div class="hud-card">
            <div class="card-label">AGGREGATED NET WORTH</div>
            <h1 style="color:var(--neon-green); font-size:24px;">$${netWorth.toLocaleString('en-US', {minimumFractionDigits:2})}</h1>
            <span style="font-size:10px; color:#94a3b8;">4 Institutions Synchronized</span>
          </div>
          <div class="hud-card">
            <div class="card-label">UNENCUMBERED VAULT</div>
            <h1 style="color:var(--neon-cyan); font-size:24px;">$${vaultLiquidity.toLocaleString('en-US', {minimumFractionDigits:2})}</h1>
            <span style="font-size:10px; color:#94a3b8;">340 Days Safe Survival Runway</span>
          </div>
          <div class="hud-card">
            <div class="card-label">PLAYER RPG LEVEL</div>
            <h1 style="color:var(--neon-gold); font-size:24px;">LVL ${playerLevel}</h1>
            <span style="font-size:10px; color:var(--neon-green);">${currentXP} / ${maxXP} XP (Rank: Centurion)</span>
          </div>
          <div class="hud-card">
            <div class="card-label">AUTOPILOT WEALTH DEFENSE</div>
            <h1 style="color:var(--neon-yellow); font-size:24px;">100% ACTIVE</h1>
            <span style="font-size:10px; color:var(--neon-green);">0 Leaks • 0 Anomalies</span>
          </div>
        </div>
      `;

      if (currentRealm === 'sigilforge') {
        html += topCards + `
          <div class="realm-header-title">
            <span>🌌 3D HOLOGRAPHIC SIGIL FORGE & SACRED GEOMETRY</span>
            <button class="btn-action btn-green" onclick="speak('Sigil Cryptographically Attested and bound to player profile!')">🔐 ATTEST & BIND SIGIL</button>
          </div>
          <div class="grid-2">
            <div class="hud-card">
              <div class="card-label">INTERACTIVE 3D GEOMETRIC CHAMBER (DRAG TO ROTATE)</div>
              <canvas id="sigil-canvas" class="realm-canvas"></canvas>
            </div>
            <div class="hud-card">
              <div class="card-label">COSMIC PRESET FORGES</div>
              <div style="display:flex; flex-direction:column; gap:10px;">
                <button class="btn-action" onclick="sigilColor='#06b6d4'; playTone(528); speak('Imperial Tesseract 4D Hypercube active.');">👑 Imperial Tesseract (528Hz)</button>
                <button class="btn-action" onclick="sigilColor='#f43f5e'; playTone(852); speak('Sentinel Aegis double merkaba active.');">🛡️ Sentinel Aegis (852Hz)</button>
                <button class="btn-action" onclick="sigilColor='#a855f7'; playTone(963); speak('Chronos Singularity active.');">🔮 Chronos Singularity (963Hz)</button>
                <button class="btn-action" onclick="sigilColor='#fbbf24'; playTone(432); speak('Solar Metatron active.');">☀️ Solar Metatron (432Hz)</button>
              </div>
            </div>
          </div>
        `;
      } else if (currentRealm === 'gamified') {
        html += topCards + `
          <div class="realm-header-title">
            <span>🏆 TROPHY HALL OF FAME & QUEST MATRIX</span>
            <button class="btn-action btn-gold" onclick="addXP(450)">🎁 OPEN LOOT CRATE (+450 XP)</button>
          </div>
          <div class="grid-2">
            <div class="hud-card">
              <div class="card-label">ACTIVE DAILY & WEEKLY QUESTS</div>
              <div style="display:flex; flex-direction:column; gap:10px;">
                <div style="display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,0.03); padding:12px; border-radius:6px;">
                  <div><strong>🗡️ Morning Bank Recon</strong><div style="font-size:10px; color:#94a3b8;">Audit 4 bank feeds for unclassified charges.</div></div>
                  <button class="btn-action btn-green" onclick="addXP(50)">+50 XP</button>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,0.03); padding:12px; border-radius:6px;">
                  <div><strong>🧾 Receipt OCR Scan</strong><div style="font-size:10px; color:#94a3b8;">Parse a receipt with Vision OCR.</div></div>
                  <button class="btn-action btn-green" onclick="addXP(100)">+100 XP</button>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,0.03); padding:12px; border-radius:6px;">
                  <div><strong>🐉 The Inflow Titan</strong><div style="font-size:10px; color:#94a3b8;">Route a full paycheck via 50/20/20/10 formula.</div></div>
                  <button class="btn-action btn-green" onclick="addXP(750)">+750 XP</button>
                </div>
              </div>
            </div>
            <div class="hud-card">
              <div class="card-label">UNLOCKED CYBER TROPHIES (12 MEDALS)</div>
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <div style="background:rgba(251,191,36,0.08); border:1px solid var(--neon-gold); padding:10px; border-radius:6px; text-align:center;">
                  <div style="font-size:24px;">👑</div><strong>Genesis Sovereign</strong><div style="font-size:8px; color:#94a3b8;">PostgreSQL Connected</div>
                </div>
                <div style="background:rgba(251,191,36,0.08); border:1px solid var(--neon-gold); padding:10px; border-radius:6px; text-align:center;">
                  <div style="font-size:24px;">💎</div><strong>Diamond Hands</strong><div style="font-size:8px; color:#94a3b8;">Portfolio Rebalanced</div>
                </div>
                <div style="background:rgba(251,191,36,0.08); border:1px solid var(--neon-gold); padding:10px; border-radius:6px; text-align:center;">
                  <div style="font-size:24px;">⚔️</div><strong>Debt Hydra Slayer</strong><div style="font-size:8px; color:#94a3b8;">$1,000+ Interest Saved</div>
                </div>
                <div style="background:rgba(251,191,36,0.08); border:1px solid var(--neon-gold); padding:10px; border-radius:6px; text-align:center;">
                  <div style="font-size:24px;">🏛️</div><strong>Centurion Vault</strong><div style="font-size:8px; color:#94a3b8;">$100k+ Net Worth Base</div>
                </div>
